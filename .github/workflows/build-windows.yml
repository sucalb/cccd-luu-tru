name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller
          # rapidocr / vietocr kéo theo opencv thường, ghi đè bản contrib (cần cho bộ đọc QR WeChat)
          pip uninstall -y opencv-python opencv-python-headless
          pip install --force-reinstall --no-deps opencv-contrib-python-headless

      - name: Download Vietnamese OCR weights
        run: Invoke-WebRequest -Uri https://vocr.vn/data/vietocr/vgg_transformer.pth -OutFile models/vgg_transformer.pth

      - name: Smoke test (source)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/smoke.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onedir --name DocCCCD launcher.py
          --add-data "app.py;."
          --add-data "cccd;cccd"
          --add-data "template.xlsx;."
          --add-data "models;models"
          --collect-all streamlit
          --collect-all rapidocr_onnxruntime
          --collect-all vietocr
          --collect-submodules cccd
          --copy-metadata streamlit

      - name: Smoke test (exe starts and serves the app)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/DocCCCD/DocCCCD.exe -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try { $r = Invoke-WebRequest -Uri http://localhost:8501/_stcore/health -UseBasicParsing; if ($r.Content -eq "ok") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $ok) { throw "DocCCCD.exe did not start" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item "HUONG DAN.txt" dist/DocCCCD/
          Compress-Archive -Path dist/DocCCCD -DestinationPath DocCCCD-Windows.zip
          "{0:N0} MB" -f ((Get-Item DocCCCD-Windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: DocCCCD-Windows
          path: DocCCCD-Windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DocCCCD-Windows.zip
